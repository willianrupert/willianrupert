<svg xmlns="http://www.w3.org/2000/svg" width="640" height="340" viewBox="0 0 640 340" role="img" aria-label="Portaria">
<style>
  .s{font-family:-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif}
  .m{font-family:'SF Mono', SFMono-Regular, ui-monospace, Menlo, Consolas, 'Liberation Mono', monospace}
  .onda{animation:onda 2.2s ease-out infinite}
  @keyframes onda{0%{opacity:0}20%{opacity:1}100%{opacity:0;transform:translateX(-6px)}}
  .mira{animation:mira 6s ease-in-out infinite}
  @keyframes mira{0%,100%{transform:translate(0,0)}25%{transform:translate(6px,-10px)}50%{transform:translate(-5px,-4px)}75%{transform:translate(4px,12px)}}
  .cai{animation:cai 3.2s cubic-bezier(.3,.6,.3,1) infinite}
  @keyframes cai{0%{transform:translateY(-6px);opacity:0}20%{opacity:1}60%,85%{transform:translateY(12px);opacity:1}100%{transform:translateY(12px);opacity:0}}
  .agua{animation:agua 2.6s linear infinite, nivel 9s ease-in-out infinite}
  @keyframes agua{to{transform:translateX(-32px)}}
  @keyframes nivel{0%,100%{translate:0 6px}50%{translate:0 -10px}}
  .led,.dot{animation:pisca 2.4s ease-in-out infinite}
  @keyframes pisca{0%,100%{opacity:.35}50%{opacity:1}}
  @media (prefers-reduced-motion: reduce){*{animation:none!important;opacity:1!important}}
</style>
<rect x="1" y="1" width="638" height="338" rx="24" fill="#ffffff" stroke="#e3e3e8" stroke-width="2"/>
<g transform="translate(40 36)">
  <rect width="84" height="84" rx="20" fill="#e8f2fd"/>
  
<g class="cai">
  <g fill="none" stroke="#0071e3" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M42 14 l16 8 v16 l-16 8 l-16 -8 v-16 z"/>
    <path d="M26 22 l16 8 l16 -8 M42 30 v16"/>
  </g>
</g>
<g fill="none" stroke="#0071e3" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M18 62 h48 M24 62 v6 M60 62 v6"/></g>
<circle cx="64" cy="18" r="3.5" fill="#1fa246" class="led"/>
</g>
<g transform="translate(494.4 44)">
  <rect width="105.6" height="28" rx="14" fill="none" stroke="#e3e3e8" stroke-width="1.5"/>
  <circle cx="15" cy="14" r="4" fill="#1fa246" class="dot"/>
  <text x="26" y="19" class="s" font-size="13" font-weight="500" fill="#6e6e73">em produção</text>
</g>
<text x="40" y="162" class="s" font-size="30" font-weight="650" letter-spacing="-0.6" fill="#1d1d1f">Portaria</text>
<text class="s" font-size="18" fill="#6e6e73"><tspan x="40" y="196">Encomendas recebidas sem porteiro: o entregador</tspan><tspan x="40" y="222">digita um código, a casa faz o resto.</tspan></text>
<line x1="40" y1="276" x2="600" y2="276" stroke="#e3e3e8" stroke-width="1.5"/>
<text x="40" y="306" class="m" font-size="14" fill="#a1a1a6">ESP32-S3 · Python · FastAPI · Node</text>
<text x="600" y="307" text-anchor="end" class="s" font-size="20" font-weight="600" fill="#0071e3">→</text>
</svg>
