<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-label="Terminal: quem sou, o que está em produção e no que estou trabalhando agora">
<style>
  .m{font-family:'SF Mono', SFMono-Regular, ui-monospace, Menlo, Consolas, 'Liberation Mono', monospace;font-size:16.25px;white-space:pre}
  .ap{animation:ap .01s linear backwards}
  @keyframes ap{from{opacity:0}to{opacity:0}}
  @keyframes d0{from{transform:translateX(0)}to{transform:translateX(62px)}}@keyframes d2{from{transform:translateX(0)}to{transform:translateX(160px)}}@keyframes d4{from{transform:translateX(0)}to{transform:translateX(131px)}}
  .cursor{animation:cur 1.1s steps(1) infinite}
  @keyframes cur{50%{opacity:0}}
  .tt{font-family:-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:13px;fill:#6e6e73}
  @media (prefers-reduced-motion: reduce){.ap{animation:none;opacity:1}rect[style]{display:none}}
</style>
<rect x="1" y="1" width="1278" height="398" rx="18" fill="#ffffff" stroke="#e3e3e8" stroke-width="2"/>
