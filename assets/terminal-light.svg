<g class="ap" style="animation-delay:0.45s"><text x="48" y="104" class="m" fill="#1fa246">❯</text><text x="74" y="104" class="m" fill="#1d1d1f">whoami</text><rect x="72" y="84" width="66.5" height="28" fill="#ffffff" transform="translate(62 0)" style="animation:d0 0.5s steps(6) 0.5s both"/></g><text x="48" y="135" class="m ap" style="animation-delay:1.2s"><tspan fill="#1d1d1f">Willian Rupert</tspan><tspan fill="#6e6e73"> · Ciência da Computação, CIn-UFPE · Recife</tspan></text><g class="ap" style="animation-delay:1.85s"><text x="48" y="166" class="m" fill="#1fa246">❯</text><text x="74" y="166" class="m" fill="#1d1d1f">ls ~/em-producao</text><rect x="72" y="146" width="164.0" height="28" fill="#ffffff" transform="translate(160 0)" style="animation:d2 0.8s steps(16) 1.9s both"/></g><text x="48" y="197" class="m ap" style="animation-delay:2.9s"><tspan fill="#0071e3">adsum/    portaria/    rlight-pendant/    caixa-dagua/</tspan></text><g class="ap" style="animation-delay:3.55s"><text x="48" y="228" class="m" fill="#1fa246">❯</text><text x="74" y="228" class="m" fill="#1d1d1f">cat agora.txt</text><rect x="72" y="208" width="134.75" height="28" fill="#ffffff" transform="translate(131 0)" style="animation:d4 0.7s steps(13) 3.6s both"/></g><text x="48" y="259" class="m ap" style="animation-delay:4.5s"><tspan fill="#0071e3">→ </tspan><tspan fill="#1d1d1f">levando uma CNC de 12 anos do Mach3 para o FluidNC</tspan></text><text x="48" y="290" class="m ap" style="animation-delay:4.85s"><tspan fill="#0071e3">→ </tspan><tspan fill="#1d1d1f">prevendo inadimplência com dados reais, em Aprendizagem de Máquina</tspan></text><text x="48" y="321" class="m ap" style="animation-delay:5.2s"><tspan fill="#0071e3">→ </tspan><tspan fill="#1d1d1f">roteamento inter-VLAN para os laboratórios do CIn</tspan></text><g class="ap" style="animation-delay:5.7s"><text x="48" y="352" class="m" fill="#1fa246">❯</text><rect x="72" y="335" width="10" height="21" fill="#0071e3" class="cursor"/></g>
