name: Generate Snake

# Controla quando a ação vai rodar
on:
  schedule:
      # Roda automaticamente a cada 12 horas
    - cron: "0 */12 * * *" 
  
  # Permite que você rode manualmente na aba "Actions" para testar agora
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Clone repo
        uses: actions/checkout@v4

      - name: Generate the snake files in './dist/'
        uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: willianrupert
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#0071e3&color_dots=#ebedf0,#cfe3fb,#8ec0f7,#3d8ef0,#0071e3
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#2997ff&color_dots=#161b22,#0b2a4a,#0f4a85,#1f6fd1,#2997ff

      - name: Push new files to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
